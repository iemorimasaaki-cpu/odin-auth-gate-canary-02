name: odin-race
run-name: "race ${{ inputs.scenario }} (no concurrency control, no Environment)"
on:
  workflow_dispatch:
    inputs:
      scenario: { description: "same-key | same-round", required: true, type: string }
permissions: {}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      fire_at: ${{ steps.t.outputs.fire_at }}
    steps:
      - id: t
        run: echo "fire_at=$(( ($(date +%s) + 75) * 1000 ))" >> "$GITHUB_OUTPUT"
  race:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GATE_REF_PREFIX: refs/odin-test/${{ github.run_id }}
      RACE_SCENARIO: ${{ inputs.scenario }}
      RACE_WORKER: ${{ matrix.worker }}
      RACE_FIRE_AT: ${{ needs.prep.outputs.fire_at }}
    steps:
      - name: Fetch scripts
        run: |
          git init -q gate && cd gate
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Fire synchronized claim attempts
        run: node gate/scripts/race.mjs
